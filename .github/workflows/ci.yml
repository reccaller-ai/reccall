name: Main Branch CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  build-test-lint:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Type check
      run: npm run type-check
      
    - name: Build project
      run: npm run build
      
    - name: Run tests
      run: npm test
      continue-on-error: true
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-basic
        path: |
          index.js
          index.d.ts
        retention-days: 7

  comprehensive-test:
    name: Comprehensive Testing
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install Make (if not available)
      run: |
        if ! command -v make &> /dev/null; then
          sudo apt-get update && sudo apt-get install -y make
        fi
    
    - name: Install dependencies
      run: make ci-deps || npm ci
      
    - name: Type check
      run: make ci-type-check || npm run type-check
      
    - name: Build project
      run: make ci-build || npm run build
      
    - name: Run tests
      run: make ci-test || npm test
      continue-on-error: true
      
    - name: Run linting
      run: make ci-lint || npm run lint
      continue-on-error: true
      
    - name: Security audit
      run: make ci-security || npm audit --audit-level moderate
      continue-on-error: true
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-comprehensive
        path: |
          index.js
          index.d.ts
        retention-days: 30

  # Website deployment moved to separate repository: reccaller-ai/websites
