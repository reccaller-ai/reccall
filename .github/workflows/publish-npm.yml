name: Publish to npm

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (patch, minor, major, or specific version like 1.0.1)'
        required: false
        default: 'patch'
      dry_run:
        description: 'Dry run (do not actually publish)'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '18'
  REGISTRY_URL: 'https://registry.npmjs.org'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        registry-url: ${{ env.REGISTRY_URL }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          # Use tag version (remove 'v' prefix if present)
          VERSION="${{ github.event.release.tag_name }}"
          VERSION=${VERSION#v}
          # Update package.json to match release version
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        elif [ -n "${{ github.event.inputs.version }}" ]; then
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.event.inputs.version }}" = "patch" ] || [ "${{ github.event.inputs.version }}" = "minor" ] || [ "${{ github.event.inputs.version }}" = "major" ]; then
            # Bump version using npm version
            npm version ${{ github.event.inputs.version }} --no-git-tag-version
            VERSION=$(node -p "require('./package.json').version")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            # Specific version provided
            npm version ${{ github.event.inputs.version }} --no-git-tag-version
            VERSION=$(node -p "require('./package.json').version")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi
        else
          # Default to patch
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        fi
        echo "📦 Version: $VERSION"
        
    - name: Build package
      run: npm run build
      
    - name: Run tests
      run: npm test
      continue-on-error: true
      
    - name: Verify package contents
      run: npm pack --dry-run
      
    - name: Create package tarball
      if: github.event_name == 'release'
      run: npm pack
      id: pack
      
    - name: Upload package to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: reccall-*.tgz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Publish to npm
      if: github.event.inputs.dry_run != 'true' || github.event_name == 'release'
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        if [ -z "$NODE_AUTH_TOKEN" ]; then
          echo "❌ NPM_TOKEN secret is not set. Please configure it in repository settings."
          echo "   Go to: Settings → Secrets and variables → Actions → New repository secret"
          echo "   Name: NPM_TOKEN"
          echo "   Value: Your npm access token (get one from https://www.npmjs.com/settings/<username>/tokens)"
          exit 1
        fi
        echo "📦 Publishing version ${{ steps.version.outputs.version }} to npm..."
        npm publish --access public
        echo "✅ Published successfully to npmjs.org!"
        
    - name: Publish to GitHub Packages (optional)
      if: github.event.inputs.dry_run != 'true' && github.event_name == 'release'
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "📦 Publishing version ${{ steps.version.outputs.version }} to GitHub Packages..."
        echo "@reccaller-ai:registry=https://npm.pkg.github.com" >> .npmrc
        echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
        # Temporarily rename package to scoped version for GitHub Packages
        # Note: This requires package.json to have a scoped name or we skip it
        echo "ℹ️  GitHub Packages requires scoped packages (@owner/package)."
        echo "   To publish to GitHub Packages, update package.json name to '@reccaller-ai/reccall'"
        echo "   Skipping GitHub Packages publish (publishing to npmjs.org only)"
        
    - name: Dry run (no publish)
      if: github.event.inputs.dry_run == 'true'
      run: |
        echo "🔍 Dry run mode - would publish version ${{ steps.version.outputs.version }}"
        npm pack
        
    - name: Create Git tag and commit
      if: github.event_name != 'release' && github.event.inputs.dry_run != 'true'
      run: |
        git add package.json package-lock.json
        git commit -m "chore: bump version to ${{ steps.version.outputs.version }}" || echo "No changes to commit"
        git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
        git push origin main --follow-tags
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

