<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .header h1 {
      margin: 0;
      font-size: 18px;
      color: #333;
    }
    
    .shortcuts-list {
      max-height: 300px;
      overflow-y: auto;
      margin-bottom: 16px;
    }
    
    .shortcut-item {
      display: flex;
      align-items: center;
      padding: 8px;
      border: 1px solid #e1e5e9;
      border-radius: 6px;
      margin-bottom: 8px;
      background: #f8f9fa;
    }
    
    .shortcut-name {
      flex: 1;
      font-weight: 500;
    }
    
    .shortcut-actions {
      display: flex;
      gap: 4px;
    }
    
    .btn {
      padding: 4px 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    
    .btn-call {
      background: #4CAF50;
      color: white;
    }
    
    .btn-delete {
      background: #f44336;
      color: white;
    }
    
    .add-shortcut {
      width: 100%;
      padding: 12px;
      background: #2196F3;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 16px;
    }
    
    .empty-state {
      text-align: center;
      color: #666;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎯 RecCall</h1>
  </div>
  
  <button class="add-shortcut" id="addShortcut">+ Add Shortcut</button>
  
  <div class="shortcuts-list" id="shortcutsList">
    <div class="empty-state">No shortcuts yet</div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
